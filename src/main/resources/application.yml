spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  jackson:
    default-property-inclusion: non-null
  application:
    name: DailyAutism
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://database:3306/daily_autism_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:rafael}
    password: ${SPRING_DATASOURCE_PASSWORD:teste123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    generate-ddl: true
    hibernate.ddl-auto: update
    repositories.enabled: true
    database: mysql

server:
  tomcat:
    max-http-form-post-size: 25MB
    max-swallow-size: 25MB

api:
  security:
    token:
      secret: ${JWT_SECRET:DailyAutismSecretKeyForJwtTokenGenerationMustBe256BitsLong2026!}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
