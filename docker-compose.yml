version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: mysql_backend
    restart: always
    environment:
      MYSQL_DATABASE: daily_autism_db   # <-- Alterado de hífen para underscore
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: rafael
      MYSQL_PASSWORD: teste123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build: .
    container_name: java_backend
    restart: always
    environment:
      - JWT_SECRET=DailyAutismSecretKeyForJwtTokenGenerationMustBe256BitsLong2026!
      - API_SECURITY_TOKEN_SECRET=DailyAutismSecretKeyForJwtTokenGenerationMustBe256BitsLong2026!
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy

volumes:
  mysql_data:
