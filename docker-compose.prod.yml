version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: dailyautism_mysql_prod
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-daily_autism_db}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_oci_secure}
      MYSQL_USER: ${MYSQL_USER:-daily_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-daily_password_oci_secure}
    volumes:
      - mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dailyautism_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dailyautism_backend_prod
    restart: always
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://database:3306/${MYSQL_DATABASE:-daily_autism_db}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER:-daily_user}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD:-daily_password_oci_secure}
      - JWT_SECRET=${JWT_SECRET:-DailyAutismSecretKeyForJwtTokenGenerationMustBe256BitsLong2026!}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - dailyautism_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: dailyautism_frontend_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - dailyautism_network

networks:
  dailyautism_network:
    driver: bridge

volumes:
  mysql_prod_data:
